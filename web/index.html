<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f2218" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Rabbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/app/icons/rabbit.svg" />
    <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png" />
    <title>Rabbit</title>
    <!-- Link previews (iMessage, Slack, ...). The server fills in __RABBIT_ORIGIN__ from
         PUBLIC_BASE_URL because og:image must be an absolute URL. -->
    <meta name="description" content="Your training pacer: a coach that reads your Garmin and your plan." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rabbit" />
    <meta property="og:title" content="Rabbit" />
    <meta property="og:description" content="Your training pacer: a coach that reads your Garmin and your plan." />
    <meta property="og:url" content="__RABBIT_ORIGIN__/app/" />
    <meta property="og:image" content="__RABBIT_ORIGIN__/app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rabbit, your training pacer" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
